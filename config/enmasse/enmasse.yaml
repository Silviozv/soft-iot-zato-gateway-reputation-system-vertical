external_scheduler:

  - name: "Agregação de Dados (tempo definido no script)"
    url: "http://localhost:11223/soft-iot/local-storage/aggregation" # URL completa
    job_type: "interval_based"
    interval: 5 #chamada para ele verificar se há dados para agregar
    unit: "minutes" # minutes, hours
    
  - name: "Limpeza (a cada 5 minutos)" #tempo deve ser maior do que o de agregação
    url: "http://localhost:11223/soft-iot/local-storage/cleanup"
    job_type: "interval_based"
    interval: 20
    unit: "minutes"

  - name: "Inicialização do gerenciador de ID"
    url: "http://localhost:11223/soft-iot/id-manager"
    job_type: "one_time"
    initial_delay: 5

  - name: "Inicialização do banco de dados"
    url: "http://localhost:11223/soft-iot/local-storage/start"
    job_type: "one_time"
    initial_delay: 10
  
  - name: "Inicialização do servidor ZMQ"
    url: "http://localhost:11223/soft-iot/dlt/zmq/start"
    job_type: "one_time"
    initial_delay: 15

  - name: "Requisição de serviços"
    url: "http://localhost:11223/soft-iot/reputation/task/check-nodes-services"
    job_type: "interval_based"
    interval: 20
    unit: "seconds"

  - name: "Cálculo da reputação atual"
    url: "http://localhost:11223/soft-iot/reputation/task/calculate-reputation"
    job_type: "interval_based"
    interval: 20
    unit: "seconds"

  - name: "Checagem de comportamento perturbador"
    url: "http://localhost:11223/soft-iot/reputation/task/change-disturbing-behavior"
    job_type: "interval_based"
    interval: 20
    unit: "seconds"

  

