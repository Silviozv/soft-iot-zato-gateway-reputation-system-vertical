security:
groups:

channel_rest:

  # Agregação
  - name: local_storage_aggregation
    service: soft-iot.aggregation.service
    url_path: /soft-iot/local-storage/aggregation
    data_format: json

  # Clean up
  - name: local_storage_cleanup
    service: soft-iot.cleanup.service
    url_path: /soft-iot/local-storage/cleanup
    data_format: json

  # Serviços da API
  - name: local_storage_get_last_data
    service: soft-iot.api.get-last-data
    url_path: /soft-iot/devices/{device_id}/sensors/{sensor_id}/data/latest
    data_format: json
  - name: local_storage_get_history
    service: soft-iot.api.get-history
    url_path: /soft-iot/devices/{device_id}/sensors/{sensor_id}/data
    data_format: json
  - name: local_storage_get_last_sensor_data
    service: soft-iot.api.get-last-sensor-data
    url_path: /soft-iot/devices/{device_id}/sensors/{sensor_id}/data/raw/latest
    data_format: json
  - name: local_storage_get_last_aggregated_data
    service: soft-iot.api.get-last-aggregated-data
    url_path: /soft-iot/devices/{device_id}/sensors/{sensor_id}/data/aggregated/latest
    data_format: json
  - name: local_storage_get_all_aggregated_data
    service: soft-iot.api.get-all-aggregated-data
    url_path: /soft-iot/devices/{device_id}/sensors/{sensor_id}/data/aggregated
    data_format: json

  # Start do local storage
  - name: local_storage_service_start
    service: soft-iot.storage.service
    url_path: /soft-iot/local-storage/start
    data_format: json

  # Mapping devices
  - name: mapping_devices_get_device
    service: soft-iot.mapping.get-device
    url_path: /soft-iot/mapping-devices/get-device
    data_format: json
  - name: mapping_devices_list_devices
    service: soft-iot.mapping.list-devices
    url_path: /soft-iot/mapping-devices/list-devices
    data_format: json

  - name: mapping_devices_collect_data
    service: soft-iot.mapping.send-get
    url_path: /soft-iot/mapping/collect
    data_format: json
  - name: mapping_devices_start_flow
    service: soft-iot.mapping.send-flow
    url_path: /soft-iot/mapping/flow
    data_format: json
  - name: mapping_devices_actuate
    service: soft-iot.mapping.send-set
    url_path: /soft-iot/mapping/actuate
    data_format: json

  # DLT client
  - name: dlt_client_api_writer
    service: soft-iot.dlt.client.api.write
    url_path: /soft-iot/dlt/transactions
    data_format: json
  - name: dlt_client_api_read_index
    service: soft-iot.dlt.client.api.read_index
    url_path: /soft-iot/dlt/transactions/index/{index}
    data_format: json
  - name: dlt_client_api_read_id
    service: soft-iot.dlt.client.api.read_id
    url_path: /soft-iot/dlt/transactions/id/{message_id}
    data_format: json

  # ZMQ server
  - name: zmq_server_start
    service: soft-iot.zmq.start
    url_path: /soft-iot/dlt/zmq/start
    data_format: json
  - name: zmq_handler_response
    service: soft-iot.zmq.handler.response
    url_path: /soft-iot/dlt/zmq/handler-response
    data_format: json
  - name: zmq_handler_request
    service: soft-iot.zmq.handler.request
    url_path: /soft-iot/dlt/zmq/handler-request
    data_format: json

  # K-Means
  - name: kmeans_credibility_service
    service: soft-iot.kmeans.credibility
    url_path: /soft-iot/kmeans/credibility
    data_format: json

  # ID manager
  - name: id_manager
    service: soft-iot.id.manager
    url_path: /soft-iot/id-manager
    data_format: json

  # Node type
  - name: node_type
    service: soft-iot.node.evaluation
    url_path: /soft-iot/evaluate
    data_format: json

  # Reputation node
  - name: reputation_credibility_manager
    service: soft-iot.reputation.credibility.manager
    url_path: /soft-iot/reputation/credibility/{evaluator_id}
    data_format: json

  # Service handler
  - name: service_handler_calculate_reputation
    service: soft-iot.reputation.task.calculate
    url_path: /soft-iot/reputation/task/calculate-reputation
    data_format: json
  - name: service_handler_change_disturbing_behavior
    service: soft-iot.reputation.task.change_disturbing_behavior
    url_path: /soft-iot/reputation/task/change-disturbing-behavior
    data_format: json
  - name: service_handler_check_nodes_services
    service: soft-iot.reputation.task.check_nodes_services
    url_path: /soft-iot/reputation/task/check-nodes-services
    data_format: json
  - name: service_handler_wait_nodes_responses
    service: soft-iot.reputation.task.wait_nodes_responses
    url_path: /soft-iot/reputation/task/wait-nodes-resposes
    data_format: json
  - name: service_handler_select_best_node
    service: soft-iot.reputation.task.select_best_node
    url_path: /soft-iot/reputation/task/select-best-node
    data_format: json
  - name: service_handler_request_node_service
    service: soft-iot.reputation.task.request_node_service
    url_path: /soft-iot/reputation/task/request-node-service
    data_format: json

  # Serviço de debug temporário
  - name: service_handler_get_data_gateway
    service: soft-iot.gateway.state.get
    url_path: /soft-iot/reputation/task/get-data
    data_format: json



  

